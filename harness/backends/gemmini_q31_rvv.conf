# gemmini_q31_rvv backend (the fused Gemmini+Saturn(RVV) target, split off
# of gemmini_q31 2026-08-28 — see pipeline/backends.py's SPLIT note above
# GEMMINI_Q31): same rv64imafdc(v) RoCC-only story as gemmini.conf, PLUS the
# rvv.conf V stanza — see pipeline/backends.py::GEMMINI_Q31_RVV for the
# rationale (kernel_opt_log.jsonl id 310/312/800+): ops with no Gemmini
# kernel (batchnorm2d_s8, maxpool2d_s8, relu_s8, linear_s8) fall back to the
# proven RVV kernels instead of scalar, so this target needs V enabled at
# the Zephyr Kconfig level too. Plain gemmini_q31 (PURE Gemmini, no `v`)
# stays a symlink to gemmini.conf — see harness/backends/gemmini_q31.conf.
#
# Same EAGER-context-switch requirement as rvv.conf, and for the identical
# reason: the FPGA hwconfig this backend targets is a HETEROGENEOUS
# 2-hart bitstream (hart 0 = plain Rocket, no V; hart 1 = Rocket + Saturn
# vector unit + Gemmini). Zephyr boots on hart 0 (RV_BOOT_HART=0); with
# LAZY=y the first V instruction in the trap-entry path (switch.S reading
# vstart) traps as illegal before UART even comes up. LAZY=n makes
# save/restore an unconditional call that early-returns when a thread's V
# state isn't dirty, so hart 0 (which never touches V) never issues a
# vsetvli. V codegen stays restricted to kernels.c via
# CONFIG_RISCV_V_KERNEL_ONLY=y (harness/Kconfig) — Zephyr/libc/broker code
# compile without V so a mid-V preemption on a multi-hart part can't
# clobber scalar state.
#
# Threads that invoke V (or Gemmini, on this target) kernels must run on
# hart 1 — harness/src/main.c pins main() there automatically whenever
# CONFIG_RISCV_ISA_EXT_V is defined AND CONFIG_SMP/CONFIG_MP_MAX_NUM_CPUS>1
# (both set by firesim_chipyard_dual_gemmini_q31.conf, the FS_CONF overlay
# examples/_run_lib.sh selects for this target's firesim builds). exp 310
# confirmed hart 1 on the SatGemDualSmall bitstream still has a working
# Gemmini RoCC port once this flips main() over to it (max_abs_err
# unchanged vs the hart-0 baseline, no RoCC trap).
CONFIG_RISCV_ISA_EXT_V=y
CONFIG_RISCV_ISA_EXT_V_LAZY=n
CONFIG_RISCV_V_KERNEL_ONLY=y
