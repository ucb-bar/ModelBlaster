# rvv backend: enable the RISC-V Vector extension at the kernel level so
# Zephyr context-switches the vector register state correctly.
CONFIG_RISCV_ISA_EXT_V=y
# Eager V save/restore: the lazy path (default) doesn't set VS_INIT
# when CONFIG_FPU_SHARING=y, so the first V instruction traps as illegal.
# Eager V ensures mstatus.VS is always CLEAN after context-switch.
CONFIG_RISCV_ISA_EXT_V_LAZY=n
# Restrict V codegen to kernel files + arch/riscv/core/v.c only. Without
# this, GCC auto-vectorizes struct-init/memset in vprintk, libc, micro-ROS,
# broker, etc. via fractional-LMUL vector stores — which on multi-hart
# Saturn FireSim makes scalar code paths interrupt-corruptible (mid-V
# instruction preemption can clobber scalar regs). We want V live ONLY
# inside the generated kernel functions, where preemption is masked
# already (run_graph_b's irq mask path).
CONFIG_RISCV_V_KERNEL_ONLY=y
