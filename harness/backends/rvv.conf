# rvv backend: V codegen ONLY inside generated kernel functions.
#
# CRITICAL: do NOT enable CONFIG_RISCV_ISA_EXT_V here. Several bitstreams
# this backend runs on (e.g. GemminiAndOPUShuttleConfig, chipyard_hetero_q31)
# have hart 0 = stock Shuttle / Rocket without V. Zephyr's RV_BOOT_HART=0
# means we always boot on tile 0. If V is enabled at the Kconfig level,
# the boot path issues a vsetvli during V context init on tile 0 (which
# doesn't have V), trapping into an unhandled-illegal-instruction loop
# before reaching printk — sim hangs forever with no UART output.
# (Same pathology rvv_opu.conf documents — observed on bxi7fz29d and
# bhwhbyqrj where the binary timed out at 1hr.)
#
# V codegen lives only in the generated kernel functions (compiled with
# -march=rv64gcv via MODELBLASTER_KERNEL_CFLAGS). Zephyr itself and libc
# are compiled without V; -fno-tree-vectorize keeps GCC from
# auto-vectorizing scalar code paths. The kernels run on hart 1 (which
# does have V) inside run_graph_b's irq_lock window, so mid-V
# preemption can't happen and V context-switch isn't required.

CONFIG_RISCV_V_KERNEL_ONLY=y
