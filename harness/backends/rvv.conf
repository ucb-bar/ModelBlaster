# rvv backend: enable V at the Zephyr Kconfig level with EAGER
# context-switch, and restrict V codegen to generated kernel files.
#
# Why eager (LAZY=n) is mandatory on hetero bitstreams:
#
# Several bitstreams this backend runs on (GemminiAndOPUShuttleConfig,
# chipyard_hetero_q31, firesim_rocket_saturn) have hart 0 = stock
# Shuttle/Rocket with no V hardware. Zephyr boots on hart 0
# (RV_BOOT_HART=0). With LAZY=y, the kernel doesn't set mstatus.VS=INIT
# when FPU_SHARING=y, so the first V instruction in switch.S (the trap
# handler trying to read vstart) traps as illegal — and the trap path
# itself executes a vsetvli, which traps again, looping forever before
# UART comes up. With LAZY=n, switch.S calls
# z_riscv_vstate_{save,restore}_thread unconditionally, but those
# functions early-return when the thread's V state isn't dirty. Threads
# on hart 0 never touch V → never dirty → save/restore is a NOP →
# no vsetvli ever runs on hart 0.
#
# V codegen is still restricted to generated kernel functions via
# CONFIG_RISCV_V_KERNEL_ONLY=y (defined in harness/Kconfig). Zephyr
# itself, libc, micro-ROS, and broker code are compiled without V
# (-fno-tree-vectorize) so GCC can't sprinkle vector ops through
# scalar paths — a mid-V preemption on a multi-hart Saturn would
# otherwise clobber scalar regs.
#
# Threads that DO invoke V kernels must be pinned to hart 1 via
# k_thread_cpu_pin(); see harness/src/main.c. The SMP / pin-only
# Kconfig that supports this lives in harness/prj.conf.
#
# Same stanza as Dima's zephyr-chipyard-sw dev branch.
CONFIG_RISCV_ISA_EXT_V=y
CONFIG_RISCV_ISA_EXT_V_LAZY=n
CONFIG_RISCV_V_KERNEL_ONLY=y
