# Overlay for FireSim's chipyard_riscv64/rocketchip_virt_riscv64 board on the
# rb_u250_rocket bitstream (FireSimRiskyBirdRocketConfig -> chipyard.RocketConfig,
# xilinx_alveo_u250, 30 MHz host).
#
# Differs from firesim_chipyard.conf ONLY in hart count. That file targets the
# dual-rocket-saturn-gemmini-q31 SoC and sets MP_MAX_NUM_CPUS=2 with SMP on;
# this bitstream has a SINGLE Rocket hart, no vector unit and no Gemmini, so
# SMP is off and the modelblaster pool multiplexes onto one hart. Select this
# file with FIRESIM_CONF=firesim_chipyard_single_rocket.conf, since _run_lib.sh
# otherwise defaults GEN_TARGET=scalar to the 2-hart firesim_chipyard.conf.
CONFIG_MAIN_STACK_SIZE=524288
CONFIG_MP_MAX_NUM_CPUS=1

# HTIF UART bulk-syscall printing -- line-buffer printk output up to 256 chars
# (covers a MODELBLASTER_PROFILE row or trace CSV row in one flush) and emit
# each buffer with a single SYS_write tohost handshake instead of N per-char
# roundtrips. The per-char handshake costs ~10K target cycles, which otherwise
# dominates measured time on an FPGA simulation and corrupts the profile.
CONFIG_UART_HTIF_BUFFERED_OUTPUT=y
CONFIG_UART_HTIF_SYSCALL_PRINT=y
CONFIG_UART_HTIF_BUFFERED_OUTPUT_SIZE=256
