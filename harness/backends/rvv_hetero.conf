# rvv_hetero backend: plain RVV kernels (no Saturn OP-V customs) compiled
# for a HETEROGENEOUS bitstream where hart 0 may not have the V
# extension at all (e.g. GemminiAndOPUShuttleConfig: tile 0 = stock
# Shuttle no-V, tile 1 = Saturn OPU has V).
#
# This is structurally the same setup as rvv_opu.conf — V codegen only
# inside generated kernels (compiled with -march=rv64gcv via
# MODELBLASTER_KERNEL_CFLAGS), Zephyr + libc compiled without V — but
# WITHOUT loading the saturn_opu headers, so the generated kernels stay
# in pure RVV and don't emit OP-V custom instructions. Used when we
# want to test kernels from kernels/rvv/* (Dima's qrb kernel set) on
# the OPU FireSim bitstream without rebuilding the bitstream.
#
# Critical: DO NOT enable CONFIG_RISCV_ISA_EXT_V here. Zephyr's
# RV_BOOT_HART=0 means we boot on tile 0. If V is enabled in Kconfig,
# the boot path issues vsetvli during V context init on tile 0 (which
# doesn't have V), trapping into an unhandled-illegal-instruction loop
# before reaching printk. The FireSim sim then "runs" forever with no
# UART output — exactly the 1hr-timeout pathology we observed on the
# bxi7fz29d / bhwhbyqrj captures before this overlay existed.

CONFIG_RISCV_V_KERNEL_ONLY=y
