# Overlay for FireSim's
# alveo_u250_firesim-dual-rocket-saturn-gemmini-no-nic-l2-llc4mb-ddr3
# hwconfig.
#
# Differences vs the quad-rocket-saturn overlay
# (firesim_chipyard.conf):
#   - 2 harts instead of 4 — MP_MAX_NUM_CPUS=2 (Zephyr's SMP boot
#     spinwaits for every configured hart, so this MUST match the
#     RTL's actual hart count or boot hangs).
#   - Each hart has a Gemmini accelerator attached. Nothing in
#     Zephyr needs to know about that — the RoCC opcodes flow
#     through gemmini.h's inline asm direct to the accelerator
#     without context-switch state.
CONFIG_MAIN_STACK_SIZE=524288
CONFIG_MP_MAX_NUM_CPUS=2
CONFIG_SMP=y
CONFIG_SCHED_CPU_MASK=y
CONFIG_SCHED_CPU_MASK_PIN_ONLY=y
CONFIG_SCHED_DUMB=y

# HTIF UART bulk-syscall printing — line-buffer printk output up to
# 256 chars (covers typical MODELBLASTER_PROFILE rows and trace CSV rows in
# one flush) and emit each buffer with a single SYS_write tohost
# handshake instead of N back-to-back PUTC roundtrips. Same wire
# format libgloss/htif_nano uses in vanilla chipyard baremetal /
# Linux. Cuts per-char ~10K-cycle handshake to once-per-line.
CONFIG_UART_HTIF_BUFFERED_OUTPUT=y
CONFIG_UART_HTIF_SYSCALL_PRINT=y
CONFIG_UART_HTIF_BUFFERED_OUTPUT_SIZE=256
