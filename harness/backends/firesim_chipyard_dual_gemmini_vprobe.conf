# PROBE overlay: firesim_chipyard_dual_gemmini.conf + Zephyr's V stanza.
#
# Purpose: the gemmini / gemmini_q31 backends compile with -march=rv64imafdc
# (no `v`), so every op WITHOUT a Gemmini kernel silently falls back to
# SCALAR code rather than to the RVV kernels -- on dronet that is
# batchnorm2d_s8 + sigmoid_s8, 42% of the model's Gemmini-backend runtime.
# The bitstream (SatGemDualSmall) has BOTH Saturn and Gemmini, so enabling V
# for the gemmini target should let the proven RVV kernels serve as the
# fallback. Before doing that plumbing there is one thing only the FPGA can
# answer: harness/src/main.c pins main to HART 1 when CONFIG_RISCV_ISA_EXT_V
# is defined. Today gemmini_q31 has no V, so it runs on hart 0. Turning V on
# moves the model to hart 1 -- and if hart 1 has no Gemmini, every RoCC
# kernel traps.
#
# This overlay changes ONLY that: same kernels, same -march, V enabled in
# Zephyr so the hart-1 pin engages. A clean run proves hart 1 has Gemmini
# and unblocks the V-enabled gemmini backend.
CONFIG_MAIN_STACK_SIZE=524288
CONFIG_MP_MAX_NUM_CPUS=2
CONFIG_SMP=y
CONFIG_SCHED_CPU_MASK=y
CONFIG_SCHED_CPU_MASK_PIN_ONLY=y
CONFIG_SCHED_DUMB=y

CONFIG_UART_HTIF_BUFFERED_OUTPUT=y
CONFIG_UART_HTIF_SYSCALL_PRINT=y
CONFIG_UART_HTIF_BUFFERED_OUTPUT_SIZE=256

# The probe itself.
CONFIG_RISCV_ISA_EXT_V=y
CONFIG_RISCV_ISA_EXT_V_LAZY=n
CONFIG_RISCV_V_KERNEL_ONLY=y
