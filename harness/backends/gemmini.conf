# gemmini backend (chipyard default int8 RoCC, DIM=16). Currently no
# Kconfig deltas vs the scalar baseline — Gemmini's custom RoCC
# instructions reach the accelerator directly through the vendored
# gemmini.h inline asm; nothing in Zephyr needs to context-switch
# extra state for them today (no Gemmini-side architectural register
# file beyond the RoCC opcode).
#
# Reserved for future flags: if we add baremetal mtime/cycle counters
# specific to Gemmini perf-counter MMIO, or DMA-coherent allocator
# alignment requirements (gemmini's tiled scratchpad needs
# DIM*sizeof(elem_t)-aligned bases for some tiled paths), they go here.
