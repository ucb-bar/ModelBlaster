# UNBUFFERED-console variant of firesim_chipyard_quad_hetero_q31.conf.
#
# The buffered variant holds output in a 256-byte buffer. That is fine for the
# XPU-RT harness, which prints a schedule line and one line per worker at
# startup and so flushes immediately. It is actively misleading for the
# SINGLE-MODEL harness, which prints a ~60-character banner and then runs the
# whole model in silence: nothing reaches the uartlog until the model finishes
# and the output block pushes the buffer past 256 bytes. A long run therefore
# looks *identical* to a hung boot -- no Zephyr banner, no progress, a uartlog
# frozen at its FireSim preamble. Two fp16 jobs were cancelled on exactly that
# misreading.
#
# Use this whenever you need to see how far a single-model FPGA run actually
# got. Everything else is identical to the buffered conf.
# Zephyr overlay for f2_quad_hetero_norose_tacit_q31_60mhz
# (chipyard.config.SatGemQuadHeteroTacitConfig).
#
# 4 Rocket cores. UNLIKE the dual bitstream -- where every tile carries BOTH a
# Saturn and a Gemmini and the CPU_P/CPU_E split is a software convention --
# the tiles here PHYSICALLY differ:
#     harts 0,1 : Rocket + Q0.31 Gemmini (16x16 WS), rv64imafdc  -- NO vector
#     harts 2,3 : Rocket + Saturn VLEN256/DLEN128,  rv64imafdcv  -- NO Gemmini
# (WithMultiRoCCFromBuildRoCC(0,1) + WithRocketVectorUnit(cores=Seq(2,3)) in
# generators/chipyard/src/main/scala/config/RoSEConfigs.scala)
#
# Consequence: an RVV kernel scheduled onto hart 0/1, or a Gemmini RoCC
# dispatch onto hart 2/3, takes an illegal-instruction trap. The XPU-RT walker
# pins each worker to its kind's harts, so correct placement is the schedule's
# responsibility -- cores/chipyard_quad_hetero_gemmini_q31.json encodes it.
CONFIG_MAIN_STACK_SIZE=524288
CONFIG_MP_MAX_NUM_CPUS=4
CONFIG_SMP=y
CONFIG_SCHED_CPU_MASK=y
CONFIG_SCHED_CPU_MASK_PIN_ONLY=y
CONFIG_SCHED_DUMB=y
CONFIG_UART_HTIF_BUFFERED_OUTPUT=n
CONFIG_UART_HTIF_SYSCALL_PRINT=y
# unbuffered: no size needed
# V is enabled tree-wide because harts 2,3 need it. Zephyr's vector state is
# saved lazily per thread; RISCV_V_KERNEL_ONLY keeps vstate off the user-thread
# switch path, which matters here because harts 0,1 would trap on any vector
# CSR access. If a hart-0/1 thread ever touches vstate this is where to look.
CONFIG_RISCV_ISA_EXT_V=y
CONFIG_RISCV_ISA_EXT_V_LAZY=n
CONFIG_RISCV_V_KERNEL_ONLY=y
