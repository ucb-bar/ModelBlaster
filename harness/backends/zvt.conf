# zvt backend: RVV + Zvt draft vector-matrix tile extension.
#
# Same eager-V setup as rvv.conf (see there for why LAZY=n and
# V_KERNEL_ONLY=y). V_KERNEL_ONLY matters even more here: any vsetvl --
# e.g. an auto-vectorized memcpy in an ISR -- clears the Zvt tile config
# (mtype).
CONFIG_RISCV_ISA_EXT_V=y
CONFIG_RISCV_ISA_EXT_V_LAZY=n
CONFIG_RISCV_V_KERNEL_ONLY=y

# Tile context save/restore (ucb-bar/zephyr branch zvt-matrix-context).
# harness/src/main.c opts the kernel thread in via arch_riscv_zvt_enable(),
# so tile state survives preemption without an irq_lock. TE must match the
# largest zvt<N>t you target; actual TE is detected at runtime per hart.
CONFIG_RISCV_ISA_EXT_ZVT=y
CONFIG_RISCV_ZVT_TE_MAX=64
