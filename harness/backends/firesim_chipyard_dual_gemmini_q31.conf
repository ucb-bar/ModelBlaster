# FS_CONF overlay for TARGET=gemmini_q31 firesim builds (selected by
# examples/_run_lib.sh's GEN_TARGET branch). Same SatGemDualSmall SoC
# topology as firesim_chipyard_dual_gemmini.conf (2 harts, each with a
# Gemmini accelerator) PLUS the V stanza, promoted from
# firesim_chipyard_dual_gemmini_vprobe.conf (kernel_opt_log.jsonl exp 310)
# now that GEMMINI_Q31.kernel_cflags carries `v` for real (exp 800+) —
# see pipeline/backends.py::GEMMINI_Q31 and harness/backends/gemmini_q31.conf
# for the full rationale. The plain (float-scale) `gemmini` target is
# UNCHANGED and stays on firesim_chipyard_dual_gemmini.conf (no `v`,
# hart-0 execution) — this file is gemmini_q31-only.
#
# CONFIG_RISCV_ISA_EXT_V=y flips harness/src/main.c's
# `#if defined(CONFIG_RISCV_ISA_EXT_V) ...` guard, which pins main() (and
# therefore the whole model) onto hart 1. hart 1 is where this
# bitstream's Saturn vector unit lives, and — per exp 310 — it also still
# has a working Gemmini RoCC port, so both the kept Gemmini kernels
# (conv2d_s8, add_s8) and the new RVV fallback kernels (batchnorm2d_s8,
# maxpool2d_s8, relu_s8, linear_s8) run on the same hart without a trap.
CONFIG_MAIN_STACK_SIZE=524288
CONFIG_MP_MAX_NUM_CPUS=2
CONFIG_SMP=y
CONFIG_SCHED_CPU_MASK=y
CONFIG_SCHED_CPU_MASK_PIN_ONLY=y
CONFIG_SCHED_DUMB=y

CONFIG_UART_HTIF_BUFFERED_OUTPUT=y
CONFIG_UART_HTIF_SYSCALL_PRINT=y
CONFIG_UART_HTIF_BUFFERED_OUTPUT_SIZE=256

# The V stanza (same content as gemmini_q31.conf / rvv.conf — repeated
# here rather than sourced, matching how firesim_chipyard_dual_gemmini_
# vprobe.conf was authored, since EXTRA_CONF_FILE takes exactly one file).
CONFIG_RISCV_ISA_EXT_V=y
CONFIG_RISCV_ISA_EXT_V_LAZY=n
CONFIG_RISCV_V_KERNEL_ONLY=y
