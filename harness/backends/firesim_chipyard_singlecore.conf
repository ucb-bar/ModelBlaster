# Single-core build for the dual-rocket FireSim bitstream. Zephyr boots ONE hart
# (parks the other); the modelblaster_pool has 1 thread so parallel_conv2d/linear
# take the DIRECT kernel path — sidestepping the multi-hart threaded-dispatch bug.
# Running a 1-core binary on a 2-core bitstream is supported. Keep SMP infra so the
# harness boots as it expects; just cap to 1 CPU.
CONFIG_MAIN_STACK_SIZE=524288
CONFIG_MP_MAX_NUM_CPUS=1
CONFIG_SMP=y

CONFIG_UART_HTIF_BUFFERED_OUTPUT=y
CONFIG_UART_HTIF_SYSCALL_PRINT=y
CONFIG_UART_HTIF_BUFFERED_OUTPUT_SIZE=256
