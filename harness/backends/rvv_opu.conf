# rvv_opu backend: RVV + Saturn OPU integer matrix engine.
#
# DO NOT enable CONFIG_RISCV_ISA_EXT_V here. The GemminiAndOPUShuttle
# bitstream has two harts: tile 0 = stock Shuttle (no V), tile 1 =
# Saturn OPU (V + OPU). Zephyr's RV_BOOT_HART=0 means we always boot
# on tile 0. If CONFIG_RISCV_ISA_EXT_V=y, the boot path issues a
# vsetvli during V context init on tile 0 (which doesn't have V),
# trapping into an unhandled-illegal-instruction loop before reaching
# printk — sim hangs forever with no UART output. See
# notes/known_issues.md for the diagnostic.
#
# Merlin's working merlin_hetero_runner / build_dronet_gem_opu samples
# also have RISCV_ISA_EXT_V off and use the same hetero bitstream.
# OPU custom instructions ride the V opcode (.insn r 0x57, ...) but
# don't need Zephyr-level V context-switch — kernels run inside
# run_graph_b's irq_lock window so the OPU MRF and VRF state can't
# be preempted mid-dispatch.
#
# V codegen lives only in the generated kernels (compiled with their
# own -march=rv64gcv via MODELBLASTER_KERNEL_CFLAGS). Zephyr itself
# and libc are compiled without V; -fno-tree-vectorize keeps GCC from
# auto-vectorizing scalar code paths.
CONFIG_RISCV_V_KERNEL_ONLY=y

# NOTE on OPU matrix-register context: m0..m3 are NEW architectural
# state introduced by the OPU bitstream, but Zephyr currently has no
# save/restore path for them. The modelblaster flow holds irq_lock across
# generated-kernel calls (run_graph_b's mask path), so a kernel can't
# be preempted mid-OPU-sequence and matrix state stays consistent
# within one dispatch. Cross-dispatch state is not assumed: every
# OPU kernel must seed its own accumulator (OPMVINBCAST) before the
# first VOPACC.
#
# If we later want OPU kernels to run in preemptable contexts (e.g.
# scheduler workers without irq_lock), we'll need a Zephyr-side
# extension here for OPU-MRF context switch. Add it as a separate
# Kconfig flip in this overlay then.
