# rvv_opu backend: RVV + Saturn OPU integer matrix engine.
#
# Same eager-V Kconfig as rvv.conf — the V vs no-V hart split on
# GemminiAndOPUShuttleConfig (hart 0 = stock Shuttle no-V, hart 1 =
# Saturn OPU with V + matrix engine) is identical to the rvv pattern,
# and the same trap-loop pathology applies if LAZY=y is used. See
# rvv.conf for the full rationale.
#
# Threads that invoke OPU kernels are pinned to hart 1 via
# k_thread_cpu_pin() in the runtime harnesses; SMP / pin-only
# Kconfig lives in harness/prj.conf. The irq_lock around
# run_graph_b's kernel call protects both V state and the OPU matrix
# file from intra-dispatch preemption on hart 1 itself.
CONFIG_RISCV_ISA_EXT_V=y
CONFIG_RISCV_ISA_EXT_V_LAZY=n
CONFIG_RISCV_V_KERNEL_ONLY=y

# NOTE on OPU matrix-register context: m0..m3 are NEW architectural
# state introduced by the OPU bitstream. Neither Zephyr upstream nor
# Dima's zephyr-chipyard-sw dev branch has a save/restore path for
# them today — struct z_riscv_v_context covers v0..v31 + V CSRs only.
# The modelblaster flow relies on the irq_lock across
# generated-kernel calls (run_graph_b's mask path) so a kernel can't
# be preempted mid-OPU-sequence and matrix state stays consistent
# within one dispatch. Cross-dispatch state is not assumed: every
# OPU kernel must seed its own accumulator via OPMVINBCAST before the
# first VOPACC.
#
# If we later want OPU kernels to run in preemptable contexts
# (scheduler workers without irq_lock), extend struct
# z_riscv_v_context + z_riscv_vstate_{save,restore}_thread to cover
# the matrix file, and flip a new Kconfig opt-in here.
