# Overlay for FireSim's
# alveo_u250_firesim-dual-rocket-big-saturn-gemmini-q31-no-nic-l2-llc4mb-ddr3
# hwconfig (FireSimREFV512D256DualRocketGemminiQ31Config). Successor to
# the dual-rocket-saturn-gemmini bitstream (firesim_chipyard_dual_gemmini.conf):
#
#   - Saturn vector unit upgraded to V512D256 (VLEN=512 bits, DLEN=256
#     bits, so 2x both vector-register width AND vector-data-path
#     width vs the old V256D128). Doubles RVV peak throughput.
#   - Gemmini Q0.31 acc_scale baked into HW (vs the old float-acc-scale
#     bitstream + compile-time Q31 fold). The kernels still set
#     -DMODELBLASTER_GEMMINI_Q31_ACC_SCALE=1 to keep the codegen path the
#     same; the difference shows up as bit-exact requantize on real
#     HW instead of the ~1-LSB-per-layer drift we saw under the float
#     bitstream.
#   - Still a 2-hart bitstream (dual-rocket).
#
# Diff vs firesim_chipyard_dual_gemmini.conf:
#   - CONFIG_RISCV_VECTOR_MAX_LEN=512 — REQUIRED. Zephyr's
#     thread-struct allocates `vreg[32][CONFIG_RISCV_VECTOR_MAX_LEN/8]`
#     for V context-switch save/restore. With the default 256 the
#     save/restore writes only the lower 256 bits of each v-reg, so
#     after a preempt the upper 256 bits leak across threads. On
#     V512D256 hardware that corrupts running RVV state — typical
#     symptom is mid-vector-instruction state leak that then
#     manifests as illegal-instruction or AMO-fault later.
#   - Gemmini-specific CFLAGS still come from modelblaster/pipeline/backends.py
#     (gemmini_q31 backend) — no Kconfig changes needed for the Q31
#     mvout path.
CONFIG_MAIN_STACK_SIZE=524288
CONFIG_MP_MAX_NUM_CPUS=2
CONFIG_SMP=y
CONFIG_SCHED_CPU_MASK=y
CONFIG_SCHED_CPU_MASK_PIN_ONLY=y
CONFIG_SCHED_DUMB=y

# RVV: bump max V context-switch state from 256 to 512 bits per
# v-register to match V512D256 saturn HW. Pure-scalar / pure-gemmini
# builds also pay this 2KB-per-thread tax — negligible.
CONFIG_RISCV_VECTOR_MAX_LEN=512

# HTIF UART bulk-syscall printing (same as firesim_chipyard*.conf —
# line-buffer printk and flush via SYS_write tohost handshake).
CONFIG_UART_HTIF_BUFFERED_OUTPUT=y
CONFIG_UART_HTIF_SYSCALL_PRINT=y
CONFIG_UART_HTIF_BUFFERED_OUTPUT_SIZE=256
