# Single-core overlay for the KernelBench/ModelBlaster ExecuTorch flow on spike.
#
# WHY: the harness prj.conf defaults to MP_MAX_NUM_CPUS=4 (SMP). XNNPACK sizes its
# pthreadpool to sysconf(_SC_NPROCESSORS_ONLN) -> 4 worker threads. On spike that
# is pathological: spike emulates all harts on ONE host thread, so 4 harts cost 4x
# the emulation, and if you run fewer harts than threads the extra threads
# oversubscribe one hart and their spin/tick wait steals the cycles the others need
# (measured >10x slowdown, and it looks like a hang because output only flushes at
# exit). For the small KernelBench convs a 1-thread INLINE pool is both fastest and
# simplest: MP_MAX_NUM_CPUS=1 makes pthreadpool a single thread, so every
# parallelize_* runs inline on the caller -- no worker dispatch, no spin.
#
# Also unbuffer the HTIF console so per-model markers (MB_MODEL_BEGIN /
# EXECUTORCH_EXECUTE_CYCLES / checksum) appear live instead of only at exit. The
# cycle printf is AFTER the rdcycle bracket, so unbuffered console does not perturb
# the measurement. Run spike with -p1 (SPIKE_HARTS=1) to match.
#
# Splice: -DEXTRA_CONF_FILE=<...>/spike_single_core.conf  (run_multi.sh does this
# by default for RUNNER=spike; opt out with SPIKE_CONF= or ET_SMP=1).
CONFIG_MP_MAX_NUM_CPUS=1
CONFIG_MAIN_STACK_SIZE=524288
CONFIG_UART_HTIF_SYSCALL_PRINT=y
CONFIG_UART_HTIF_BUFFERED_OUTPUT=n
