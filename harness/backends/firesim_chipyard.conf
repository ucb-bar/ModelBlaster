# Overlay for FireSim's chipyard_riscv64/rocketchip_virt_riscv64 board
# (alveo_u250_firesim-quad-rocket-saturn-no-nic-l2-llc4mb-ddr3 hwconfig).
#
# Two changes vs the spike-only prj.conf:
#  - shrink the main stack from 4 MB to 256 KB. The FPGA build's RAM
#    region is laid out differently from spike's flat 256 MB and the
#    huge stack reservation makes early init silently hang before the
#    Zephyr banner prints. 256 KB still covers DroNet's worst-case
#    im2col VLA (~295 KB? note: models that need > 256 KB stack should
#    bump this further or refactor the kernel to avoid the VLA).
#  - bring in the same SMP knobs the working FireSim samples use.
CONFIG_MAIN_STACK_SIZE=262144
CONFIG_MP_MAX_NUM_CPUS=2
CONFIG_SMP=y
CONFIG_SCHED_CPU_MASK=y
CONFIG_SCHED_CPU_MASK_PIN_ONLY=y
CONFIG_SCHED_DUMB=y
