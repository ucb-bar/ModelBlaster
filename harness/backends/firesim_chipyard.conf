# Overlay for FireSim's chipyard_riscv64/rocketchip_virt_riscv64 board
# (alveo_u250_firesim-quad-rocket-saturn-no-nic-l2-llc4mb-ddr3 hwconfig).
#
# Two changes vs the spike-only prj.conf:
#  - shrink the main stack from 4 MB to 512 KB. The FPGA build's RAM
#    region is laid out differently from spike's flat 256 MB and the
#    huge stack reservation makes early init silently hang before the
#    Zephyr banner prints. 256 KB sufficed for sequential dronet but
#    was too tight when pool_size=1 sends a full work-chunk through
#    main and dronet's im2col VLA overflows: dronet@p1 produced
#    garbage output while @p2/@p4 (chunks split across worker stacks)
#    passed. 512 KB clears the worst-case VLA with margin.
#  - bring in the same SMP knobs the working FireSim samples use.
#  - boot all 4 harts the quad-rocket-saturn hwconfig provides so the
#    pool-sweep harness can actually compare topo_0 / topo_0_1 /
#    topo_0_1_2_3.
CONFIG_MAIN_STACK_SIZE=524288
CONFIG_MP_MAX_NUM_CPUS=4
CONFIG_SMP=y
CONFIG_SCHED_CPU_MASK=y
CONFIG_SCHED_CPU_MASK_PIN_ONLY=y
CONFIG_SCHED_DUMB=y
