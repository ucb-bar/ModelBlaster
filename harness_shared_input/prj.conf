# Shared-input harness — minimal single-hart config, same as the
# single-model harness's prj.conf. We run variants sequentially with
# pool=NULL (no MODELBLASTER_USE_POOL), so we don't need SMP / POSIX /
# thread affinity — those are the things that hang on spike (no true
# SMP). If a caller later wants the parallel path, they enable
# MODELBLASTER_USE_POOL + swap in a harness_multi-style prj.conf with
# CONFIG_SMP=y et al.
#
# The 4 MB main stack matches the single-model harness — large enough
# for im2col-style algorithms that allocate OH*OW * IC*KH*KW floats
# as a stack VLA. DroNet's worst case is about 295 KB.

CONFIG_MAIN_STACK_SIZE=4194304
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_FPU=y

# Explicit single-hart no-SMP pin. Without this the harness inherits
# whatever the board's Kconfig defaults are, which on chipyard_riscv64
# comes out CONFIG_SMP=y + CONFIG_MP_MAX_NUM_CPUS=1 — SMP init code
# runs against a mismatched hart count and is a well-known pre-UART
# hang pattern (Dima flagged the same footgun on the ET runner).
# We run variants sequentially with pool=NULL and don't need SMP;
# pinning MP=1 + SMP=n makes the harness's config identical whether it
# lands on spike_riscv64 (SMP=n by default) or chipyard_riscv64.
CONFIG_MP_MAX_NUM_CPUS=1
CONFIG_SMP=n

# HTIF UART buffered-output size. Default 64 bytes silently drops chars
# when Zephyr printfs faster than the tsi bridge drains — a 4-variant
# fused run's per-variant VERIFY + WALL_CYCLES markers already crowd
# the buffer; a 6-variant run lost 4 of 6 tag-labelled markers before
# the runner's post-run parse could see them. 4 KiB is enough to hold
# every marker line from an 8-way batch without loss and costs 4 KiB
# of static RAM (negligible against ram0's 256 MB).
CONFIG_UART_HTIF_BUFFERED_OUTPUT_SIZE=4096
