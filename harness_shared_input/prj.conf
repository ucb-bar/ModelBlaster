# Shared-input harness — same SMP/POSIX/picolibc footprint as
# harness_multi. This file is intentionally a near-copy: the runtime
# needs identical Zephyr config to what harness_multi's linked
# modelblaster_pool + POSIX-affinity setup expects, and diverging here
# would silently subtly change the measured cycle counts vs the
# single-model or multi-model baselines.
#
# The only differences from harness_multi/prj.conf are commentary.

CONFIG_THREAD_STACK_INFO=y
CONFIG_MP_MAX_NUM_CPUS=4
CONFIG_SMP=y
# 4 MB main stack — same as harness_multi. Worst-case per-variant stack
# use is one variant at a time; we don't stack N variants' worst cases.
CONFIG_MAIN_STACK_SIZE=4194304
CONFIG_THREAD_STACK_MEM_MAPPED=y
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_STACK_SIZE=16384
CONFIG_DYNAMIC_THREAD_ALLOC=y

CONFIG_SCHED_CPU_MASK=y
CONFIG_SCHED_CPU_MASK_PIN_ONLY=n
CONFIG_SCHED_DUMB=y

CONFIG_POSIX_API=y
CONFIG_MULTITHREADING=y
CONFIG_POSIX_THREADS=y
CONFIG_POSIX_THREADS_AFFINITY=y

CONFIG_FPU=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_HEAP_MEM_POOL_SIZE=1048576
