# agents_pool unit test — same SMP / POSIX / picolibc footprint as the
# multi-model harness so the test exercises agents_pool under the same
# Zephyr config the production harnesses use.
CONFIG_THREAD_STACK_INFO=y
CONFIG_MP_MAX_NUM_CPUS=4
CONFIG_SMP=y
CONFIG_MAIN_STACK_SIZE=1048576
CONFIG_THREAD_STACK_MEM_MAPPED=y
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_STACK_SIZE=16384
CONFIG_DYNAMIC_THREAD_ALLOC=y

CONFIG_SCHED_CPU_MASK=y
CONFIG_SCHED_CPU_MASK_PIN_ONLY=n
CONFIG_SCHED_DUMB=y

CONFIG_POSIX_API=y
CONFIG_MULTITHREADING=y
CONFIG_POSIX_THREADS=y
# pthread_attr_setaffinity_np (vendored Phase A patch — see
# agents/harness_multi/zephyr_patches/posix-affinity.patch).
CONFIG_POSIX_THREADS_AFFINITY=y

CONFIG_FPU=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_HEAP_MEM_POOL_SIZE=1048576

CONFIG_GNU_C_EXTENSIONS=y
CONFIG_STD_C17=y
CONFIG_PICOLIBC=y
CONFIG_COMMON_LIBC_MALLOC=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=8388608
