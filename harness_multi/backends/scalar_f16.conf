# scalar backend, fp16 mode: enable RISC-V Zfh (scalar half-precision)
# so the kernel context switch saves/restores f-state correctly when
# `_Float16` instructions (fadd.h / fmul.h / fcvt.s.h / etc.) are
# emitted by the compiler. target_riscv.cmake (Dima's Aug-13 patch)
# picks up _zfh in -march automatically when this Kconfig is y.
CONFIG_RISCV_ISA_EXT_ZFH=y
