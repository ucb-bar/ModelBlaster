CONFIG_RISCV_ISA_EXT_V=y
# Eager V context switching — lazy-trap routing on secondary harts has
# a regression where the first vector instruction on hart!=0 takes the
# illegal-instruction trap but doesn't reach z_riscv_fpu_trap
# (mcause=2 / mtval=0xcc747057, vsetivli). The same encoding showed up
# again on a yolov8_nano-RVV pool=1 profile attempt as `mcause=7
# Store/AMO fault, mtval=0xcc747057` — the corrupted vector state
# leaked into a base-address register and the next vse8 trapped.
# Eager saves+restores the v reg file every context switch with
# VS=Clean, sidestepping the broken trap path. Mirrors the same
# workaround in agents/harness_xpurt/backends/rvv.conf — both
# harnesses run kernels on RVV hart!=0 paths under firesim
# (multi_demo's pool worker spawn, xpurt's per-kind worker pinning).
CONFIG_RISCV_ISA_EXT_V_LAZY=n
