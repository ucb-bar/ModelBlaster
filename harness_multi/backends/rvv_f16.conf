# rvv backend, fp16 mode: enable both Zfh (scalar half) and Zvfh (vector
# half) on top of the existing V extension so the compiler can emit
# vfadd.vv / vfmul.vv / vfcvt etc. with eew=16. target_riscv.cmake's
# Aug-13 patch threads _zfh / _zvfh into -march when these Kconfigs
# are set. Saturn's refParams wires FType.H so the bitstream supports
# this; spike with `--isa=rv64gcv_zicntr_zfh_zvfh` does too.
CONFIG_RISCV_ISA_EXT_V=y
CONFIG_RISCV_ISA_EXT_ZFH=y
CONFIG_RISCV_ISA_EXT_ZVFH=y
