# Multi-model harness — same SMP/POSIX/picolibc footprint as the
# original pthreadpool-linked build (kept aligned with samples/xnnpack)
# so modelblaster_pool inherits the exact runtime config the dispatch
# numbers were measured under.

CONFIG_THREAD_STACK_INFO=y
CONFIG_MP_MAX_NUM_CPUS=4
CONFIG_SMP=y
# 4 MB main stack — needed for our biggest models' worst-case stack
# VLAs (DroNet's im2col_buf hits ~295 KB but other paths can be bigger).
CONFIG_MAIN_STACK_SIZE=4194304
CONFIG_THREAD_STACK_MEM_MAPPED=y
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_STACK_SIZE=16384
CONFIG_DYNAMIC_THREAD_ALLOC=y

CONFIG_SCHED_CPU_MASK=y
CONFIG_SCHED_CPU_MASK_PIN_ONLY=n
CONFIG_SCHED_DUMB=y

CONFIG_POSIX_API=y
CONFIG_MULTITHREADING=y
CONFIG_POSIX_THREADS=y
# pthread_attr_setaffinity_np (vendored Phase A patch — see
# modelblaster/harness_multi/zephyr_patches/posix-affinity.patch).
CONFIG_POSIX_THREADS_AFFINITY=y

CONFIG_FPU=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_HEAP_MEM_POOL_SIZE=1048576

CONFIG_GNU_C_EXTENSIONS=y
CONFIG_STD_C17=y
CONFIG_PICOLIBC=y
CONFIG_COMMON_LIBC_MALLOC=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=67108864
