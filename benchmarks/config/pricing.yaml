# Per-LLM-model token pricing. Used by aggregate.compute_cost_usd to
# derive `dollars_equivalent` from tokens_input_cached / _uncached /
# output. Rates are $ per million tokens (MTok).
#
# Rates rotate. Update this file (and only this file) to re-price the
# entire dashboard.

last_updated: 2026-05-25
sources:
  anthropic:        https://platform.claude.com/docs/en/about-claude/pricing
  bedrock:          https://aws.amazon.com/bedrock/pricing/
  bedrock_models:   https://docs.aws.amazon.com/bedrock/latest/userguide/model-cards.html
  gemini:           https://ai.google.dev/pricing

# Bedrock pricing for Anthropic Claude 4.5+ models follows a different
# structure than 3.5/4.0:
#   - Global endpoints (dynamic routing):  same rates as Anthropic first-party.
#   - Regional endpoints (e.g. us-east-1): +10% premium.
# The `us.` prefix in model ids (us.anthropic.claude-sonnet-4-5-...) is a
# US cross-region inference profile -- effectively a US-scoped global
# endpoint, so it uses STANDARD rates with no +10% premium. If a future
# experiment pins to a single-region (non-`us.`-prefixed) endpoint, the
# pricing entries below need a +10% multiplier applied.
#
# Older Bedrock-Anthropic models (3.5 Sonnet v2 and earlier) used the
# legacy 2x first-party markup -- preserved below for `us.anthropic.claude-3-5-sonnet-v2`.

# Claude API (first-party) rates. Cache writes have two flavors:
# 5-minute and 1-hour. The 5-minute write is the default and what the
# Claude Code session JSONL records. If 1-hour writes ever appear in
# session telemetry, extend the aggregator and the schema accordingly.
models:

  claude-opus-4-7:
    input_uncached:        5.00
    cache_write_5m:        6.25
    cache_write_1h:       10.00
    cache_read:            0.50
    output:               25.00
    provider: anthropic

  claude-opus-4-6:
    input_uncached:        5.00
    cache_write_5m:        6.25
    cache_write_1h:       10.00
    cache_read:            0.50
    output:               25.00
    provider: anthropic

  claude-opus-4-5:
    input_uncached:        5.00
    cache_write_5m:        6.25
    cache_write_1h:       10.00
    cache_read:            0.50
    output:               25.00
    provider: anthropic

  claude-sonnet-4-6:
    input_uncached:        3.00
    cache_write_5m:        3.75
    cache_write_1h:        6.00
    cache_read:            0.30
    output:               15.00
    provider: anthropic

  claude-sonnet-4-5:
    input_uncached:        3.00
    cache_write_5m:        3.75
    cache_write_1h:        6.00
    cache_read:            0.30
    output:               15.00
    provider: anthropic

  claude-haiku-4-5:
