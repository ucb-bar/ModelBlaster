# Runs the ModelBlaster test suite on every push to main and on every pull
# request into it. Torch comes from the CPU wheel index; tests that need the
# RISC-V cross toolchain, spike, FireSim or a board skip themselves.
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # third_party/KernelBlaster, needed by the kb tests

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]' --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Run tests
        run: python -m pytest -q -rs
