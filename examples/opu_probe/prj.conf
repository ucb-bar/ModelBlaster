# Minimal Zephyr config for the OPU ISA probe. Matches the
# firesim_chipyard_dual_gemmini overlay's essentials so the binary
# boots cleanly on the 2-hart FireSimGemminiAndOPUShuttleConfig.

CONFIG_MAIN_STACK_SIZE=8192
# Single-hart probe — we only need to execute the tests once.
# Second hart spins in Zephyr's idle thread.
CONFIG_MP_MAX_NUM_CPUS=2
CONFIG_SMP=y

# HTIF UART — same printk path as the production xpurt harness.
# Without buffered output, each printf in the probe blocks on a
# single-char SYS_write tohost cycle (~10K cycles each) which is
# slow but acceptable for a one-off probe.
CONFIG_UART_HTIF_BUFFERED_OUTPUT=y
CONFIG_UART_HTIF_SYSCALL_PRINT=y
CONFIG_UART_HTIF_BUFFERED_OUTPUT_SIZE=128

# Probe needs printf for output markers.
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=n
CONFIG_NEWLIB_LIBC_NANO=y
