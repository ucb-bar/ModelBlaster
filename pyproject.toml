[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modelblaster"
version = "0.1.0"
description = "PyTorch -> Zephyr/RISC-V end-to-end compile + run + validate pipeline."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "numpy",
    "requests",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = [
    # Bedrock client for BACKEND=llm and the beam-search optimize loop.
    "boto3>=1.34",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
benchmarks = [
    # Aggregator + dashboard rendering.
    "pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["modelblaster"]
# The `modelblaster/` directory is a thin shim (one __init__.py) whose
# __path__ points back at the repo root so existing top-level
# subdirectories (pipeline/, optimize/, ...) resolve as
# modelblaster.<subpackage>. Editable install only.

[tool.ruff]
line-length = 100
target-version = "py311"
