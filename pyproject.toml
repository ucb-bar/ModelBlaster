[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modelblaster"
version = "0.1.0"
description = "PyTorch -> Zephyr/RISC-V end-to-end compile + run + validate pipeline."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
    "numpy",
    "requests",
    "pyyaml>=6.0",
    "pillow>=12.2.0",
    "ultralytics>=8.4.55",
]

[project.optional-dependencies]
llm = [
    # Provider SDKs for BACKEND=llm and the beam-search optimize loop.
    # Bedrock client uses requests directly (no boto3 needed); Gemini
    # uses google-genai. Both are optional so a curated-only run does
    # not need them installed.
    "google-genai>=1.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
benchmarks = [
    # Aggregator + dashboard rendering.
    "pyyaml>=6.0",
    # Live cost monitor TUI (modelblaster.benchmarks.tools.cost_monitor).
    "rich>=13.0",
]
smolvla = [
    # SmolVLA admission pulls the canonical lerobot checkout in editable
    # mode so its policies.smolvla.modeling_smolvla module is importable
    # without re-implementing it. Resolved (via [tool.uv.sources] below) to
    # the merlin sibling checkout at ../merlin/third_party/lerobot; override
    # that source entry if your checkout lives elsewhere.
    "lerobot",
    "lerobot[transformers-dep]",
    # SmolVLM's text processor turns digits into words via num2words at
    # tokenization time. Not in lerobot's base deps, but the processor
    # raises at __init__ if it is missing.
    "num2words>=0.5",
]
scheduler = [
    # XPU-RT scheduler as a real library. Brings in cvxpy + solvers.
    # After `uv sync --extra scheduler`, callers can `from xpurt import schedule, Workload`.
    "xpurt",
]

[tool.uv.sources]
# XPU-RT and merlin are sibling checkouts next to this repo. Paths are
# relative to this pyproject.toml, so they work from any clone location.
xpurt = { path = "../XPU-RT", editable = true }
lerobot = { path = "../merlin/third_party/lerobot", editable = true }

[project.scripts]
# `uv run mb-cost` launches the live cost monitor with sensible
# defaults (watches every llm_calls.jsonl under benchmarks/results,
# refreshes 4 Hz). The wrapper is here so the command is one short
# token rather than a module path.
mb-cost = "modelblaster.benchmarks.tools.cost_monitor:main"
# `uv run mb-cost-demo` runs the fake-call producer for offline TUI
# verification (see cost_monitor_demo.py).
mb-cost-demo = "modelblaster.benchmarks.tools.cost_monitor_demo:main"

[tool.hatch.metadata]
# The `smolvla` optional-dependency entry uses a `file://` direct
# reference to a sibling checkout of lerobot; hatch requires this opt-in
# before it will pass the metadata to the wheel.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/modelblaster"]
# `src/modelblaster/` is a thin shim (one __init__.py) whose __path__
# points back at the repo root so existing top-level subdirectories
# (pipeline/, optimize/, ...) resolve as modelblaster.<subpackage>.
# The src/ layout matters: an editable install adds `src/` (not the
# repo root) to sys.path, so top-level `import datasets` resolves to
# HuggingFace's datasets pip package rather than our local
# `datasets/` directory. Editable install only.

[tool.ruff]
line-length = 100
target-version = "py311"
