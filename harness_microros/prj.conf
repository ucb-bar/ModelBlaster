#
# micro-ROS baseline harness Kconfig.
# Mirrors samples/micro_ros_local/prj.conf — same SMP + microros + custom
# transport setup — plus the modelblaster-side stack/heap sizing the kernel
# binaries need (large weight blobs + intermediate buffers).

# --- micro-ROS ---------------------------------------------------------
CONFIG_MICROROS=y
CONFIG_APP_LINK_WITH_MICROROS=y
CONFIG_MICROROS_TRANSPORT_SERIAL=y
CONFIG_MICROROS_SERIAL_PORT="0"
CONFIG_MICROROS_NODES="2"
CONFIG_MICROROS_PUBLISHERS="2"
CONFIG_MICROROS_SUBSCRIBERS="0"
CONFIG_MICROROS_CLIENTS="0"
CONFIG_MICROROS_SERVERS="0"

# --- modelblaster harness sizing ---------------------------------------------
# yolov8_nano weights + intermediate buffers + per-session rmw output
# streams. 8 MB heap is overkill for dronet alone but lines up with what
# the xpurt baseline already uses for the same model pair.
CONFIG_MAIN_STACK_SIZE=32768
CONFIG_HEAP_MEM_POOL_SIZE=8388608
CONFIG_PRIVILEGED_STACK_SIZE=4096

CONFIG_POSIX_API=y
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_STATIC_INIT_GNU=y

# FPU + vector register save/restore. picolibc's vectorized memcpy uses
# RVV vse64.v which needs aligned addresses; without FPU_SHARING the
# vector regs aren't saved on context switch and yolov8's thread
# resumes with stale VL/vstart state, faulting on the first vse64.v.
# Force eager V save (LAZY=n): lazy save trap-on-first-use leaves
# vstart uninitialized between thread switches in our config and the
# next vle.v / vse.v hits a garbage address (mtval=0xcc747057, mcause
# load/store fault) — same workaround harness_xpurt uses implicitly.
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_RISCV_ISA_EXT_V=y
CONFIG_RISCV_ISA_EXT_V_LAZY=n
# Saturn-fork decoupled-lazy V (CONFIG_RISCV_V_DECOUPLED_LAZY) is
# implemented in arch/riscv/core/v.c and validated by FireSim
# v_save_smoke (0/8 mismatches per thread).  It removes the F-lazy +
# eager-V interaction surface in fpu.c that's the most likely
# residual-fault culprit (see modelblaster/notes/zephyr_v_decouple_design.md
# and zephyr_rvv_fix_summary.md).  Default OFF here because flipping
# it on requires a clean libmicroros rebuild — the colcon parallel
# build in third-party/micro_ros_zephyr_module hits a generated-header
# race that intermittently truncates rcutils/logging_macros.h on
# fresh builds.  Flip to y AFTER:
#   rm -rf third-party/micro_ros_zephyr_module/modules/libmicroros/{micro_ros_src/build,micro_ros_src/install,configured_colcon.meta,zephyr_toolchain.cmake}
# and a clean repeat build.  See modelblaster/notes/zephyr_v_decouple_design.md
# for the FireSim-canary protocol.
# CONFIG_RISCV_V_DECOUPLED_LAZY=y

# --- SMP + per-thread affinity -----------------------------------------
# 4 harts cover (broker + 2 executors + 1 headroom) on spike. FireSim's
# Q31 dual-rocket-saturn-gemmini bitstream only has 2 harts; that build
# requires squeezing the broker onto an executor hart at lower priority.
CONFIG_MP_MAX_NUM_CPUS=4
CONFIG_SMP=y
CONFIG_SCHED_CPU_MASK=y
CONFIG_SCHED_CPU_MASK_PIN_ONLY=y

# k_poll, used by the broker for multi-session inbound queue waits.
CONFIG_POLL=y

# Wall-cycle measurements need a high-resolution counter source.
CONFIG_TIMING_FUNCTIONS=y

# Disable Zephyr's default exception register dump so the fatal-error
# path immediately drops into k_sys_fatal_error_handler (our override
# in main.c). The default dump issues a printk per register; the
# broker thread on the other hart holds htif_lock for each HDLC
# topic-emit frame, so the second printk hangs and our custom handler
# never runs. With EXCEPTION_DEBUG off, only mcause+mtval print before
# z_fatal_error() is called.
CONFIG_EXCEPTION_DEBUG=n
CONFIG_EXCEPTION_STACK_TRACE=n
