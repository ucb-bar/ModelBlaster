# rvv backend, fp16 mode, for the SCHEDULED (xpurt) harness.
#
# This file was missing: harness_xpurt/backends/ had only rvv.conf and
# scalar.conf, so a scheduled build with BACKENDS=...,rvv_f16 got NO overlay
# at all and CONFIG_RISCV_ISA_EXT_V was left unset. Zephyr then never enables
# mstatus.VS, and the first vsetvli in the run traps:
#     mcause: 2, Illegal instruction   mtval: 0x0c3777d7
#         -> vsetvli x15, x14, e8, m8, ta, ma
# (an *integer* vsetvli -- the fault is the V extension being off, not a
# missing fp16 extension; the Saturn bitstream has Zfh+Zvfh unconditionally,
# WithRocketVectorUnit hardcodes vfh=true and minFLen=16 for every tile).
#
# Mirrors harness/backends/rvv_f16.conf, which is why the SINGLE-model
# rvv_f16 builds have always worked. Kept in step with this harness's own
# rvv.conf: eager V save/restore (V_LAZY=n) rather than the lazy path, which
# is what avoids the "first V instruction traps illegal" CONFIG_FPU_SHARING
# interaction. Matters more here than in the single-model harness, because
# this build is SMP (CONFIG_MP_MAX_NUM_CPUS=2) and V state has to survive
# migration between the gemmini hart and the Saturn hart.
CONFIG_RISCV_ISA_EXT_V=y
CONFIG_RISCV_ISA_EXT_ZFH=y
CONFIG_RISCV_ISA_EXT_ZVFH=y
CONFIG_RISCV_ISA_EXT_V_LAZY=n
