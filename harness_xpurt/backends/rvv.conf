# rvv backend: enable V at the Zephyr Kconfig level with EAGER
# context-switch. See harness/backends/rvv.conf for the full rationale
# (LAZY=y traps on hart-0-without-V; LAZY=n's save/restore is a NOP for
# non-V-dirty threads). Threads invoking V kernels must be pinned to
# the V-capable hart via k_thread_cpu_pin() — see
# harness_xpurt/src/main.c.
#
# Required for any harness build that runs RVV ops on hart!=0 (true for
# xpurt with pool>=2 or with helper harts spawned per kind).
CONFIG_RISCV_ISA_EXT_V=y
CONFIG_RISCV_ISA_EXT_V_LAZY=n
