CONFIG_RISCV_ISA_EXT_V=y
# Eager V context switching — lazy-trap routing on secondary harts has
# a regression where the first vector instruction on hart!=0 takes the
# illegal-instruction trap but doesn't reach z_riscv_fpu_trap (mcause=2
# / mtval=0xcc747057, vsetivli).  Eager saves+restores the v reg file
# every context switch with VS=Clean, sidestepping the broken trap path.
# Required for any harness build that runs RVV ops on hart!=0 (true
# for xpurt with pool>=2 or with helper harts spawned per kind).
CONFIG_RISCV_ISA_EXT_V_LAZY=n
