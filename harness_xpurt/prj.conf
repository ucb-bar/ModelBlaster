# Schedule-driven multi-network harness — same SMP/POSIX/picolibc
# footprint as harness_multi (which itself inherits from the
# samples/xnnpack reference) so agents_pool runs under the exact
# runtime config we benched against.

CONFIG_THREAD_STACK_INFO=y
# CONFIG_MP_MAX_NUM_CPUS is intentionally NOT set here — it is bitstream-
# /spike-specific. The per-target overlay applied by run.sh sets it:
#   spike  -> agents/harness/backends/spike_quad.conf      (4 harts)
#   firesim quad-rocket-saturn -> firesim_chipyard.conf    (4 harts)
#   firesim dual-rocket-saturn-gemmini ->
#                              firesim_chipyard_dual_gemmini.conf (2 harts)
# Zephyr's SMP boot spinwaits for every configured hart, so a wrong value
# hangs forever — keeping the count out of prj.conf forces every callsite
# to declare the topology explicitly.
CONFIG_SMP=y
# 4 MB main stack — needed for our biggest models' worst-case stack
# VLAs (DroNet's im2col_buf hits ~295 KB but other paths can be bigger).
CONFIG_MAIN_STACK_SIZE=4194304
CONFIG_THREAD_STACK_MEM_MAPPED=y
CONFIG_DYNAMIC_THREAD=y
# 1 MB per worker thread.  The xpurt walker dispatches kernels from
# per-kind pthread workers (NOT from main like multi_demo), so the
# big-VLA kernels (DroNet's 295 KB im2col_buf, yolov8's similar-scale
# conv scratch) overflow the previous 16 KB worker stack and corrupt
# adjacent memory -> saved RA gets clobbered, ret jumps to a garbage
# PC, fault as `mcause=1 Instruction Access fault`.  4 MB exceeds
# Zephyr's dynamic-thread allocator and pthread_create returns EINVAL
# (rc=22); 1 MB clears the worst-case kernel stack with margin and
# fits the allocator's per-thread size limit.
CONFIG_DYNAMIC_THREAD_STACK_SIZE=1048576
CONFIG_DYNAMIC_THREAD_ALLOC=y

CONFIG_SCHED_CPU_MASK=y
CONFIG_SCHED_CPU_MASK_PIN_ONLY=n
CONFIG_SCHED_DUMB=y

CONFIG_POSIX_API=y
CONFIG_MULTITHREADING=y
CONFIG_POSIX_THREADS=y
# pthread_attr_setaffinity_np (vendored Phase A patch — see
# agents/harness_multi/zephyr_patches/posix-affinity.patch).
CONFIG_POSIX_THREADS_AFFINITY=y

CONFIG_FPU=y
CONFIG_CBPRINTF_FP_SUPPORT=y
# 8 MB kernel heap. CONFIG_DYNAMIC_THREAD_ALLOC=y with POOL_SIZE=0 means
# pthread_attr_init's k_thread_stack_alloc(DYNAMIC_STACK_SIZE) routes
# through z_thread_aligned_alloc -> kernel system heap. With 1 MB
# per-thread stacks and at least 2 per-kind workers + margin, the
# previous 1 MB heap could not satisfy a single allocation, so
# pthread_attr_init quietly left attr->stack=NULL and pthread_create
# returned EINVAL (rc=22) on the per-kind worker spawn.
CONFIG_HEAP_MEM_POOL_SIZE=8388608

CONFIG_GNU_C_EXTENSIONS=y
CONFIG_STD_C17=y
CONFIG_PICOLIBC=y
CONFIG_COMMON_LIBC_MALLOC=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=67108864
